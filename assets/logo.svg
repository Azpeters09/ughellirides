<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EED99A"/>
      <stop offset=".45" stop-color="#D4A94E"/>
      <stop offset="1" stop-color="#A9853B"/>
    </linearGradient>
    <radialGradient id="navy" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#1B2942"/>
      <stop offset="1" stop-color="#0B1220"/>
    </radialGradient>
  </defs>

  <!-- Crest field -->
  <circle cx="256" cy="256" r="248" fill="url(#navy)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".55"/>

  <!-- Diamond accent (glamour) -->
  <rect x="245" y="86" width="22" height="22" transform="rotate(45 256 97)" fill="url(#gold)"/>
  <rect x="245" y="86" width="22" height="22" transform="rotate(45 256 97)" fill="none" stroke="#0B1220" stroke-width="1.5"/>

  <!-- UR monogram -->
  <text x="256" y="300" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="188" letter-spacing="-6" fill="url(#gold)">UR</text>

  <!-- Journey line -->
  <path d="M136 352 Q256 392 376 352" stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M170 372 Q256 400 342 372" stroke="url(#gold)" stroke-width="2.5" fill="none" opacity=".55" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="256" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="30" font-weight="600" letter-spacing="10" fill="#E9CF8B">UGHELLI</text>
  <text x="256" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="17" letter-spacing="14" fill="url(#gold)">RIDES</text>
</svg>
